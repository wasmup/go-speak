<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Go Speak</title>

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            font-family: sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        #topbar {
            flex: 0 0 auto;
            background: #eee;
            padding: 10px;
            border-bottom: 1px solid #ccc;

            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #progressRow {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: #f8f8f8;
            border-bottom: 1px solid #ddd;
        }

        #progress {
            flex: 1 1 auto;
            height: 18px;
        }

        #progressText {
            min-width: 130px;
            font-size: 14px;
            color: #333;
            text-align: right;
        }

        #text {
            flex: 1 1 auto;
            width: 100%;
            box-sizing: border-box;
            border: none;
            resize: none;
            margin: 0;
            padding: 0;
            font-family: monospace;
            font-size: 16px;
            outline: none;
        }

        #currentSentence {
            font-size: 16px;
            font-weight: 500;
            color: #222;
            white-space: pre-wrap;
            margin: 0;
            padding: 0;
        }

        button {
            font-size: 16px;
            padding: 6px 14px;
            cursor: pointer;
        }

        label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        input[type="number"] {
            width: 80px;
            padding: 5px;
            font-size: 14px;
        }

        #currentRow {
            flex: 0 0 auto;
            padding: 10px;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
        }

        #currentLabel {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
    </style>
</head>

<body>

    <div id="topbar">

        <div class="controls">
            <label for="model_name">Model</label>
            <select id="model_name" name="model_name">
                {{range $i, $m := .Models}}
                <option value="{{$m}}" {{if eq $.Index $i}}selected{{end}}>
                    {{$m}}
                </option>
                {{end}}
            </select>
            <button id="btnSave" onclick="saveMP3()">Save MP3</button>
            <button id="btnPlay" onclick="play()">Play</button>
            <button id="btnPause" onclick="togglePause()">Pause</button>
            <button id="btnStop" onclick="stop()">Stop</button>
            <button id="btnClear" onclick="clearText()">Clear</button>
        </div>

        <label>
            Speaker id:
            <input id="sid" type="number" value="{{ .SID }}" min="0" step="1" max="904" oninput="updateSID()" title="Qwen voices: 0 Ryan, 1 Vivian, 2 Serena, 3 Uncle_Fu, 4 Aiden, 5 Dylan, 6 Eric, 7 Ono_Anna, 8 Sohee">
        </label>

        <label>
            Speed:
            <input id="speed" type="number" value="{{ .Speed }}" min="0.2" step="0.05" max="4" oninput="updateSpeed()">
        </label>

        <div id="status-bar">
            <span>Speed: <b id="wpm-display">0</b> WPM</span>
        </div>

        <label>
            Exclude chars:
            <input id="exclude" type="text" value="*#">
        </label>

        <label>
            Split sentence chars:
            <input id="split" type="text" value='.!?:"“”'>
        </label>

    </div>

    <div id="error" role="alert" style="color: #a00; padding: 0 10px;"></div>
    <div id="currentRow">
        <div id="currentLabel">Now playing:</div>
        <div id="currentSentence"></div>
    </div>


    <div id="progressRow">
        <progress id="progress" value="0" max="100"></progress>
        <span id="progressText">0 / 0 chunks</span>
    </div>

    <textarea id="text" aria-label="Text to speak">{{ .StartupText }}</textarea>

    <script>
        let progressTimer = null;
        let isPaused = false;
        function showError(err) { document.getElementById('error').textContent = err.message || String(err); }
        async function request(path, options) {
            const response = await fetch(path, options);
            if (!response.ok) throw new Error((await response.text()).trim() || `Request failed (${response.status})`);
            return response;
        }
        
        async function togglePause() {
            try {
            const resp = await request('/pause', { method: 'POST' });
            const data = await resp.json();
            isPaused = data.paused;
            document.getElementById('btnPause').innerText = isPaused ? 'Resume' : 'Pause';
            } catch (err) { showError(err); }
        }

        function clearText() {
            document.getElementById('text').value = '';
        }


        function stop() {
            request("/stop", {
                method: "POST"
            }).then(() => {
                updateProgress()
            }).catch(showError)
        }

        function startProgressPolling() {
            if (progressTimer !== null) {
                clearInterval(progressTimer)
            }

            updateProgress()

            progressTimer = setInterval(updateProgress, 300)
        }

        function stopProgressPolling() {
            if (progressTimer !== null) {
                clearInterval(progressTimer)
                progressTimer = null
            }
        }

        async function updateProgress() {
            try {
                const res = await request("/progress");
                if (!res.ok) throw new Error("Network response was not ok");
                const data = await res.json();
                document.getElementById('wpm-display').innerText = data.wpm;
                isPaused = data.paused;
                document.getElementById('btnPause').innerText = isPaused ? 'Resume' : 'Pause';
                if (data.error) showError(new Error(data.error));

                const progress = document.getElementById("progress");
                const progressText = document.getElementById("progressText");
                const currentSentence = document.getElementById("currentSentence");
                const btnPause = document.getElementById("btnPause");

                progress.max = 100;
                progress.value = data.percent;
                progressText.textContent = `${data.done} / ${data.total} chunks (${data.percent}%)`;

                currentSentence.textContent = data.current || "";

                if (!data.playing) {
                    btnPause.innerText = 'Pause';
                    isPaused = false;
                    stopProgressPolling();
                    return; // Exit function
                }

            } catch (err) {
                showError(err);
                stopProgressPolling();
            }
        }


        function updateSID() {

            const sid = document.getElementById("sid").value

            request("/set_sid", {
                method: "POST",
                body: new URLSearchParams({
                    sid: sid
                })
            }).catch(showError)
        }

        function updateSpeed() {

            const speed = document.getElementById("speed").value

            request("/set_speed", {
                method: "POST",
                body: new URLSearchParams({
                    speed: speed
                })
            }).catch(showError)
        }

        async function saveMP3() {
            let name = prompt("MP3 filename:", "speech.mp3");
            if (name === null) return;
            name = name.trim().replace(/[\\/]/g, "_");
            if (!name) { showError(new Error("Enter a filename")); return; }
            if (!name.toLowerCase().endsWith('.mp3')) name += '.mp3';
            const button = document.getElementById('btnSave');
            document.getElementById('error').textContent = '';
            button.disabled = true;
            try {
                const response = await request('/save_mp3', { method: 'POST', body: new URLSearchParams({
                    text: document.getElementById('text').value,
                    exclude: document.getElementById('exclude').value,
                    split: document.getElementById('split').value,
                    model_name: document.getElementById('model_name').value
                }) });
                const url = URL.createObjectURL(await response.blob());
                const link = document.createElement('a');
                link.href = url; link.download = name; link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (err) { showError(err); }
            finally { button.disabled = false; }
        }

        function play() {
            const text = document.getElementById("text").value
            const exclude = document.getElementById("exclude").value
            const split = document.getElementById("split").value
            const model_name = document.getElementById("model_name").value


            document.getElementById('error').textContent = '';
            document.getElementById('btnPlay').disabled = true;
            request("/play", {
                method: "POST",
                body: new URLSearchParams({
                    text: text,
                    exclude: exclude,
                    split: split,
                    model_name: model_name
                })
            })
                .then(resp => {
                    if (!resp.ok) {
                        throw new Error("play failed")
                    }
                    return resp.json()
                })
                .then(data => {
                    document.getElementById("text").value = data.text
                    startProgressPolling()
                })
                .catch(err => { showError(err); })
                .finally(() => { document.getElementById('btnPlay').disabled = false; })
        }

        startProgressPolling()
    </script>

</body>

</html>
